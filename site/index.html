<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Watch Price Tracker</title>
<style>
:root{--bg:#f6f7f9;--panel:#fff;--fg:#1c2330;--muted:#5d6678;--line:#dde1e8;--ok:#0b7a43;--warn:#a85a00;--accent:#24507a}
@media (prefers-color-scheme:dark){:root{--bg:#12161d;--panel:#1a202a;--fg:#e8ecf2;--muted:#9aa4b5;--line:#2b3340;--ok:#4cc38a;--warn:#e0a24a;--accent:#7fb0e0;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif;padding:24px max(16px,env(safe-area-inset-left))}
main{max-width:72rem;margin:0 auto}
h1{font-size:1.7rem;font-weight:600;margin:0}
.sub{color:var(--muted);margin:4px 0 20px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,19rem),1fr));gap:14px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px;display:flex;flex-direction:column;gap:8px;min-width:0}
.card.best{border-color:var(--ok)}
.top{display:flex;justify-content:space-between;gap:8px}
h2{font-size:1rem;margin:0;font-weight:600}
.ref{color:var(--muted);font-size:.8rem}
.pill{font-size:.75rem;padding:2px 8px;border-radius:99px;border:1px solid var(--line);white-space:nowrap;height:fit-content;color:var(--muted)}
.pill.best{color:var(--ok);border-color:var(--ok)}
.pill.above{color:var(--warn);border-color:var(--warn)}
.price{font-size:2rem;font-weight:600;font-variant-numeric:tabular-nums;line-height:1.1}
.row{display:flex;gap:20px;flex-wrap:wrap}
.k{display:block;color:var(--muted);font-size:.75rem}
.v{font-variant-numeric:tabular-nums}
svg{width:100%;height:44px}
.note{color:var(--muted);font-size:.8rem;margin:0}
.warn{color:var(--warn)}
a.buy{align-self:flex-start;padding:7px 14px;border:1px solid var(--ok);color:var(--ok);border-radius:8px;text-decoration:none}
a.buy:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.offers{display:flex;gap:6px 12px;flex-wrap:wrap;font-size:.8rem}.offers a{color:var(--accent)}
.wait{color:var(--muted);font-size:.85rem}
footer{color:var(--muted);font-size:.8rem;margin-top:20px}
</style>
</head>
<body>
<main>
<h1>Watch Price Tracker</h1>
<p class="sub" id="sub">Loading prices…</p>
<div class="grid" id="grid"></div>
<footer>US retailers only. Checked at 9:00, 13:00 and 17:00 Eastern. A buy link shows only when today's price matches or beats the lowest price logged. Some past lows are unverified search results that live checks will replace.</footer>
</main>
<script>
const usd=n=>n.toLocaleString("en-US",{style:"currency",currency:"USD"});
const el=(t,c,x)=>{const e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e};
function spark(h){
  const s=document.createElementNS("http://www.w3.org/2000/svg","svg");s.setAttribute("viewBox","0 0 200 44");s.setAttribute("preserveAspectRatio","none");
  if(h.length<2)return null;
  const ys=h.map(p=>p[1]),lo=Math.min(...ys),hi=Math.max(...ys),r=hi-lo||1;
  const pts=h.map((p,i)=>`${(i/(h.length-1)*196+2).toFixed(1)},${(40-(p[1]-lo)/r*36).toFixed(1)}`).join(" ");
  const l=document.createElementNS(s.namespaceURI,"polyline");
  l.setAttribute("points",pts);l.setAttribute("fill","none");l.setAttribute("stroke","var(--accent)");l.setAttribute("stroke-width","2");l.setAttribute("vector-effect","non-scaling-stroke");
  s.appendChild(l);return s;
}
fetch("prices.json",{cache:"no-store"}).then(r=>r.json()).then(d=>{
  const g=document.getElementById("grid");
  const atLow=d.watches.filter(w=>w.status!=="above").length;
  document.getElementById("sub").textContent=`${atLow} of ${d.watches.length} watches are at their lowest price seen. Updated ${new Date(d.updated).toLocaleString("en-US",{timeZone:"America/New_York",dateStyle:"medium",timeStyle:"short"})} ET.`;
  d.watches.forEach(w=>{
    const best=w.status!=="above";
    const c=el("div","card"+(best?" best":""));
    const top=el("div","top"),L=el("div");
    L.append(el("h2",null,w.watch),el("span","ref",`${w.ref} · ${w.retailer}`));
    top.append(L,el("span","pill "+(best?"best":"above"),w.status==="new_low"?"New low":best?"At lowest seen":"Above past low"));
    c.append(top,el("span","k","Today"),el("div","price",usd(w.today)));
    const r=el("div","row");
    [["Past low",w.past_low],["Regular",w.regular]].forEach(([k,v])=>{const x=el("div");x.append(el("span","k",k),el("span","v",usd(v)));r.append(x)});
    c.append(r);
    if(w.offers&&w.offers.length>1){const o=el("div","offers");w.offers.forEach(f=>{const a=el("a",null,`${f.retailer} ${usd(f.price)}`);a.href=f.url;a.target="_blank";a.rel="noopener noreferrer";o.append(a)});c.append(o)}
    const sp=spark(w.history);if(sp)c.append(sp);
    if(w.stale)c.append(el("p","note warn","Live check failed; showing the last known price. "+w.note));
    if(best){const a=el("a","buy","Buy at "+w.retailer);a.href=w.buy_url;a.target="_blank";a.rel="noopener noreferrer";c.append(a)}
    else c.append(el("span","wait","Wait for a lower price"));
    g.append(c);
  });
}).catch(()=>{document.getElementById("sub").textContent="Could not load prices.json."});
</script>
</body>
</html>
